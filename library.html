<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#15110E; color:#C7B9A6; }
  .library { max-width:1080px; margin:0 auto; padding:24px 16px; }
  .lib-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:18px; }
  .lib-title { font-size:28px; margin:0; letter-spacing:.02em; color:#C7B9A6; }
  .lib-controls { display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap; }
  .lib-group { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .lib-label { font-size:18px; opacity:.9; }
  .chipset { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { appearance:none; border:1px solid #C7B9A6; background:transparent; color:#C7B9A6; padding:6px 10px; font:inherit; letter-spacing:.02em; cursor:pointer; border-radius:3px; }
  .chip:is(:hover,:focus-visible){ outline:0; background:rgba(199,185,166,.08); }
  .chip.is-active{ background:rgba(199,185,166,.15); }
  .lib-table { width:100%; border-top:1px solid #C7B9A6; margin-top:12px; }
  .lib-row { display:grid; grid-template-columns:160px 140px 1fr 240px; gap:12px; padding:14px 0; border-bottom:1px solid #C7B9A6; }
  .lib-row--head { font-size:12px; text-transform:uppercase; letter-spacing:.08em; opacity:.7; }
  .lib-col a { color:#C7B9A6; text-decoration:none; border-bottom:1px solid transparent; }
  .lib-col a:hover { border-bottom-color:#C7B9A6; }
      .lib-col.col-title a::after { content: " →"; font-weight: normal; opacity: 0.8; }
  .col-type,.col-date,.col-outlet{ white-space:nowrap; }
  .lib-msg{ margin-top:12px; font-size:14px; opacity:.85; }
  @media (max-width:760px){
    .lib-head{ flex-direction:column; align-items:stretch; }
    .lib-row{ grid-template-columns:1fr; }
    .lib-row--head{ display:none; }
  }
</style>
</head>
<body>
<section class="library" id="app">
  <header class="lib-head">
    <h2 class="lib-title">Library</h2>
    <div class="lib-controls">
      <div class="lib-group" role="group" aria-label="Show">
        <span class="lib-label">Show</span>
        <div id="show-group" class="chipset" data-mode="filter">
          <button class="chip is-active" data-value="">All</button>
          <!-- typer autogenereres herunder -->
        </div>
      </div>
      <div class="lib-group" role="group" aria-label="Sort">
        <span class="lib-label">Sort</span>
        <div id="sort-group" class="chipset" data-mode="sort">
          <button class="chip is-active" data-value="date-desc">Date ↓</button>
          <button class="chip" data-value="date-asc">Date ↑</button>
          <button class="chip" data-value="type-asc">Type A–Z</button>
          <button class="chip" data-value="title-asc">Title A–Z</button>
        </div>
      </div>
    </div>
  </header>

  <div class="lib-table" role="table" aria-label="Library list">
    <div class="lib-row lib-row--head" role="row">
      <div class="lib-col col-type" role="columnheader">Type</div>
      <div class="lib-col col-date" role="columnheader">Date</div>
      <div class="lib-col col-title" role="columnheader">Title</div>
      <div class="lib-col col-outlet" role="columnheader">Outlet</div>
    </div>
    <!-- rows injected here -->
  </div>
  <div class="lib-msg" id="msg"></div>
</section>

<script>
(async function(){
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSoQTksLhTrPuVf1M8TJ4NGXJs-rCyNwjBwoSXPQWTN6l51SUuN3LXEz2z9xa2ucABhEYHTy9F6pru_/pub?gid=912394319&single=true&output=csv';

  const container = document.querySelector('.lib-table');
  const headRow = document.querySelector('.lib-row--head');
  const showGroup = document.getElementById('show-group');
  const sortGroup = document.getElementById('sort-group');
  const msg = document.getElementById('msg');

  function parseCSV(text){
    const rows = [];
    let cur = '', inQuotes = false, row = [];
    for (let i=0; i<text.length; i++){
      const c = text[i], n = text[i+1];
      if (c === '"' && inQuotes && n === '"'){ cur += '"'; i++; continue; }
      if (c === '"'){ inQuotes = !inQuotes; continue; }
      if (c === ',' && !inQuotes){ row.push(cur); cur=''; continue; }
      if ((c === '\n' || c === '\r') && !inQuotes){
        if (cur.length || row.length){ row.push(cur); rows.push(row); row=[]; cur=''; }
        continue;
      }
      cur += c;
    }
    if (cur.length || row.length){ row.push(cur); rows.push(row); }
    return rows;
  }

  function toISODate(v){
    if(!v) return '';
    const s = String(v).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const s2 = s.replace(/\./g,'-');
    const parts = s2.split('-').map(p=>p.padStart(2,'0'));
    if (parts.length === 3){
      if (parts[0].length === 4) return `${parts[0]}-${parts[1]}-${parts[2]}`;
      return `20${parts[2]}-${parts[1]}-${parts[0]}`;
    }
    return s;
  }

  function renderRows(items){
    container.querySelectorAll('.lib-row:not(.lib-row--head)').forEach(el=>el.remove());
    const frag = document.createDocumentFragment();
    items.forEach(it=>{
      const art = document.createElement('article');
      art.className = 'lib-row';
      art.setAttribute('role','row');
      art.dataset.type = it.type || '';
      art.dataset.date = it.date || '';
      art.dataset.title = it.title || '';
      art.innerHTML = `
        <div class="lib-col col-type">${it.type || ''}</div>
        <time class="lib-col col-date" datetime="${it.date || ''}">${it.date || ''}</time>
        <div class="lib-col col-title">
          ${it.url ? `<a href="${it.url}" target="_blank" rel="noopener">${it.title || ''}</a>` : (it.title || '')}
        </div>
        <div class="lib-col col-outlet">${it.outlet || ''}</div>
      `;
      frag.appendChild(art);
    });
    headRow.after(frag);
  }

  function buildTypeChips(items){
    const types = [...new Set(items.map(i=>i.type).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    types.forEach(t=>{
      if (![...showGroup.children].some(c=>c.dataset?.value===t)){
        const b = document.createElement('button');
        b.className = 'chip'; b.dataset.value = t; b.textContent = t;
        showGroup.appendChild(b);
      }
    });
  }

  function applyFilterSort(){
    const type = showGroup.querySelector('.chip.is-active')?.dataset.value || '';
    const sort = sortGroup.querySelector('.chip.is-active')?.dataset.value || 'date-desc';
    const rows = [...container.querySelectorAll('.lib-row:not(.lib-row--head)')];

    rows.forEach(r => r.style.display = (!type || r.dataset.type === type) ? '' : 'none');

    const [key, dir] = sort.split('-');
    const visible = rows.filter(r => r.style.display !== 'none');
    visible.sort((a,b)=>{
      const av=a.dataset[key]||'', bv=b.dataset[key]||'';
      if(key==='date') return dir==='desc' ? bv.localeCompare(av) : av.localeCompare(bv);
      return av.localeCompare(bv, undefined, {sensitivity:'base'});
    });
    visible.forEach(r=>container.appendChild(r));
  }

  function attachChipHandlers(){
    function setActive(group, btn){
      group.querySelectorAll('.chip').forEach(b=>b.classList.toggle('is-active', b===btn));
    }
    showGroup.addEventListener('click', e=>{
      if(e.target.matches('.chip')){ setActive(showGroup, e.target); applyFilterSort(); }
    });
    sortGroup.addEventListener('click', e=>{
      if(e.target.matches('.chip')){ setActive(sortGroup, e.target); applyFilterSort(); }
    });
  }

  try{
    msg.textContent = 'Loading…';
    const res = await fetch(CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP '+res.status);
    const csv = await res.text();
    const rows = parseCSV(csv);
    const headers = rows.shift().map(h=>h.trim().toLowerCase());

    const items = rows.map(r=>{
      const obj = {};
      headers.forEach((h, i)=> obj[h] = r[i] ?? '');
      obj.status = String(obj.status || '').toLowerCase();
      obj.selected = /^(y(es)?|ja|true|1)$/i.test(String(obj.selected || '').trim());
      if (obj.date) obj.date = toISODate(obj.date);
      if (obj.url) obj.url = String(obj.url).trim();
      obj.title = String(obj.title || '').trim();
      obj.type = String(obj.type || '').trim();
      obj.outlet = String(obj.outlet || '').trim();
      return obj;
    }).filter(o => o.status === 'publish' && o.selected && o.title);

    if (!items.length){
      msg.textContent = 'No published items found.';
      return;
    }

    items.sort((a,b)=> (b.date||'').localeCompare(a.date||''));

    buildTypeChips(items);
    renderRows(items);
    attachChipHandlers();
    applyFilterSort();
    msg.textContent = '';
  } catch (e){
    console.error(e);
    msg.textContent = 'Failed to load library data. Check the CSV URL or publishing settings.';
  }
})();
</script>
</body>
</html>
